DATASETS:
  BETAS_REG: true
  CONFIG:
    COLOR_SCALE: 0.2
    DO_FLIP: false
    EXTREME_CROP_AUG_LEVEL: 1
    EXTREME_CROP_AUG_RATE: 0.0
    FLIP_AUG_RATE: 0.0
    ROT_AUG_RATE: 0.6
    ROT_FACTOR: 30
    SCALE_FACTOR: 0.3
    TRANS_AUG_RATE: 0.5
    TRANS_FACTOR: 0.02
  MOCAP: FREIHAND-MOCAP
  TRAIN:
    COCOW-TRAIN:
      WEIGHT: 0.1
    DEX-TRAIN:
      WEIGHT: 0.05
    FREIHAND-TRAIN:
      WEIGHT: 0.25
    H2O3D-TRAIN:
      WEIGHT: 0.05
    HALPE-TRAIN:
      WEIGHT: 0.05
    HO3D-TRAIN:
      WEIGHT: 0.05
    INTERHAND26M-TRAIN:
      WEIGHT: 0.25
    MPIINZSL-TRAIN:
      WEIGHT: 0.05
    MTC-TRAIN:
      WEIGHT: 0.1
    RHD-TRAIN:
      WEIGHT: 0.05
  VAL:
    FREIHAND-TRAIN:
      WEIGHT: 1.0
EXTRA:
  FOCAL_LENGTH: 5000.0
  NUM_LOG_IMAGES: 4
  NUM_LOG_SAMPLES_PER_IMAGE: 8
  PELVIS_IND: 0
GENERAL:
  CHECKPOINT_SAVE_TOP_K: 1
  CHECKPOINT_STEPS: 10000
  LOG_STEPS: 1000
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 2
  TOTAL_STEPS: 1000000
  VAL_STEPS: 1000
LOSS_WEIGHTS:
  ADVERSARIAL: 0.0
  BETAS: 0.0
  GLOBAL_ORIENT: 0.0
  HAND_POSE: 0.0
  KEYPOINTS_2D: 0.0
  KEYPOINTS_3D: 0.0
MANO:
  CREATE_BODY_POSE: false
  DATA_DIR: /workspace/pose_reconstract/inputs/data
  GENDER: neutral
  MEAN_PARAMS: /workspace/pose_reconstract/inputs/data/mano_mean_params.npz
  MODEL_PATH: /workspace/pose_reconstract/inputs/data/mano
  NUM_HAND_JOINTS: 15
MODEL:
  BACKBONE:
    FEATURE_DIM: 2048
    SIZE: 50
    SPATIAL_HEIGHT: 8
    SPATIAL_WIDTH: 8
    TYPE: resnet
  IMAGE_MEAN:
  - 0.485
  - 0.456
  - 0.406
  IMAGE_SIZE: 256
  IMAGE_STD:
  - 0.229
  - 0.224
  - 0.225
  MANO_HEAD:
    IN_CHANNELS: 2048
    TRANSFORMER_DECODER:
      context_dim: 2048
      depth: 6
      dim_head: 64
      dropout: 0.0
      emb_dropout: 0.0
      heads: 8
      mlp_dim: 1024
      norm: layer
    TYPE: transformer_decoder
TRAIN:
  BATCH_SIZE: 32
  LOSS_REDUCTION: mean
  LR: 1.0e-05
  NUM_TEST_SAMPLES: 64
  NUM_TRAIN_SAMPLES: 2
  POSE_2D_NOISE_RATIO: 0.01
  SMPL_PARAM_NOISE_RATIO: 0.005
  WEIGHT_DECAY: 0.0001
ckpt_path: null
exp_name: hamer
extras:
  enforce_tags: true
  ignore_warnings: false
  print_config: true
seed: null
tags:
- dev
task_name: train
test: false
train: true
